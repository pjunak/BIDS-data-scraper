# Runs as the image's non-root user: nginx -e stderr -c /app/web/nginx.conf -g 'daemon off;'
worker_processes 1;
pid /tmp/nginx.pid;
error_log stderr warn;

events { worker_connections 256; }

http {
    include /etc/nginx/mime.types;
    types { application/gzip gz; }
    default_type application/octet-stream;
    access_log off;
    sendfile on;
    charset utf-8;
    server_tokens off;
    # Keep redirects relative: behind Caddy, nginx's own scheme and port (http, 8080) are internal.
    absolute_redirect off;

    client_body_temp_path /tmp/nginx-body;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;

    # Klientská IP z Caddy (jen Caddy se k nginx dostane), kvůli limitu pokusů o přihlášení.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    limit_req_zone $binary_remote_addr zone=login:1m rate=10r/m;
    limit_req_status 429;

    server {
        listen 8080;
        server_name _;
        root /app/web;

        # Docker DNS: upstream se hledá až při požadavku, takže nginx nastartuje
        # i když Datasette nebo auth zrovna neběží (a `nginx -t` projde i v CI).
        resolver 127.0.0.11 valid=30s ipv6=off;

        # Všechno kromě přihlášení vyžaduje platnou session (služba auth, web/auth.py).
        auth_request /auth/check;
        error_page 401 = @login;
        location @login {
            return 303 /login?next=$request_uri;
        }
        location = /auth/check {
            internal;
            auth_request off;
            set $auth http://auth:8081;
            proxy_pass $auth;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
        }
        location = /auth/login {
            auth_request off;
            set $auth http://auth:8081;
            limit_req zone=login burst=5 nodelay;
            proxy_pass $auth;
            proxy_set_header X-Real-IP $remote_addr;
        }
        location = /auth/logout {
            auth_request off;
            set $auth http://auth:8081;
            proxy_pass $auth;
        }
        location = /login {
            auth_request off;
            try_files /login.html =404;
            add_header Cache-Control "no-cache";
        }
        location = /healthz {
            auth_request off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location = / {
            try_files /index.html =404;
            add_header Cache-Control "no-cache";
        }
        location / {
            return 404;
        }

        # Datasette – živá databáze, SQL, CSV export. Datasette poslouchá na kořeni;
        # base_url /db/ jen mění odkazy, které generuje, proto se prefix tady odřízne.
        location /db/ {
            set $datasette http://datasette:8001;
            rewrite ^/db/(.*)$ /$1 break;
            proxy_pass $datasette;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_buffering off;
            proxy_read_timeout 120s;
        }

        # Tlačítko Spustit sběr: GET stav, POST požadavek. Přijímá ho běžící sběrač (collector/trigger.py).
        location = /api/run {
            set $collector http://collector:8082;
            auth_request_set $bids_role $upstream_http_x_bids_role;
            proxy_set_header X-Bids-Role $bids_role;
            proxy_pass $collector;
            add_header Cache-Control "no-store";
        }

        # Noční snapshoty databáze (.sqlite.gz)
        location /exports/ {
            alias /data/exports/;
            autoindex on;
            autoindex_exact_size off;
            autoindex_localtime on;
        }
        location /api/exports/ {
            alias /data/exports/;
            autoindex on;
            autoindex_format json;
            add_header Cache-Control "no-cache";
        }

        # Logy sběrače (podporují Range kvůli „tail“ na přehledu)
        location /logs/ {
            alias /data/logs/;
            autoindex on;
            default_type text/plain;
            add_header Cache-Control "no-cache";
        }

        # Stažené sekundární zdroje
        location /files/ {
            alias /data/files/;
            autoindex on;
            autoindex_exact_size off;
            autoindex_localtime on;
        }
    }
}
