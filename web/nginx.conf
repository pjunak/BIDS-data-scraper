# Runs as the image's non-root user: nginx -e stderr -c /app/web/nginx.conf -g 'daemon off;'
worker_processes 1;
pid /tmp/nginx.pid;
error_log stderr warn;

events { worker_connections 256; }

http {
    include /etc/nginx/mime.types;
    types { application/gzip gz; }
    default_type application/octet-stream;
    access_log off;
    sendfile on;
    charset utf-8;
    server_tokens off;

    client_body_temp_path /tmp/nginx-body;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;

    server {
        listen 8080;
        server_name _;
        root /app/web;

        # Docker DNS: upstream se hledá až při požadavku, takže nginx nastartuje
        # i když Datasette zrovna neběží (a `nginx -t` projde i v CI).
        resolver 127.0.0.11 valid=30s ipv6=off;

        location = / {
            try_files /index.html =404;
            add_header Cache-Control "no-cache";
        }
        location = /healthz {
            default_type text/plain;
            return 200 "ok\n";
        }
        location / {
            return 404;
        }

        # Datasette – živá databáze, SQL, CSV export. Datasette poslouchá na kořeni;
        # base_url /db/ jen mění odkazy, které generuje, proto se prefix tady odřízne.
        location /db/ {
            set $datasette http://datasette:8001;
            rewrite ^/db/(.*)$ /$1 break;
            proxy_pass $datasette;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_buffering off;
            proxy_read_timeout 120s;
        }

        # Noční snapshoty databáze (.sqlite.gz)
        location /exports/ {
            alias /data/exports/;
            autoindex on;
            autoindex_exact_size off;
            autoindex_localtime on;
        }
        location /api/exports/ {
            alias /data/exports/;
            autoindex on;
            autoindex_format json;
            add_header Cache-Control "no-cache";
        }

        # Logy sběrače (podporují Range kvůli „tail“ na přehledu)
        location /logs/ {
            alias /data/logs/;
            autoindex on;
            default_type text/plain;
            add_header Cache-Control "no-cache";
        }

        # Stažené sekundární zdroje
        location /files/ {
            alias /data/files/;
            autoindex on;
            autoindex_exact_size off;
            autoindex_localtime on;
        }
    }
}
